name: Mission Control child-abort E2E release gate

on:
  workflow_dispatch:
    inputs:
      mc_ref:
        description: Immutable Mission Control commit SHA
        required: true
        type: string
      gc_ref:
        description: Immutable Ground Control commit SHA
        required: true
        type: string

jobs:
  cross-repository-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Validate immutable repository refs
        env:
          MC_REF: ${{ inputs.mc_ref }}
          GC_REF: ${{ inputs.gc_ref }}
        run: node -e "for (const value of [process.env.MC_REF,process.env.GC_REF]) if (!/^[0-9a-f]{40}$/.test(value ?? '')) process.exit(2)"
      - uses: actions/checkout@v4
        with:
          repository: noizbuster/mission-control
          ref: ${{ inputs.mc_ref }}
          path: mission-control
      - uses: actions/checkout@v4
        with:
          repository: noizbuster/ground-control
          ref: ${{ inputs.gc_ref }}
          path: ground-control
      - uses: actions/setup-node@v4
        with:
          node-version: 26.3.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Enable Corepack
        run: corepack enable
      - name: Install and build Mission Control
        working-directory: mission-control
        run: corepack pnpm@10.24.0 install --frozen-lockfile && corepack pnpm@10.24.0 build
      - name: Build Mission Control sidecar
        working-directory: mission-control
        run: cargo build --manifest-path native/sidecar/Cargo.toml
      - name: Install and build Ground Control
        working-directory: ground-control
        run: corepack pnpm@11.5.1 install --frozen-lockfile && corepack pnpm@11.5.1 build
      - name: Run shared cross-repository E2E
        run: node "${{ github.workspace }}/ground-control/scripts/run-mc-child-abort-e2e.mjs" --mc-worktree "${{ github.workspace }}/mission-control" --gc-worktree "${{ github.workspace }}/ground-control"
